[package]
name = "declarapop"
version = "0.1.0"
edition = "2024"

[dependencies]
libflatpak = "0.7"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = "1"
toml = "1"

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
features = ["tokio"]

[features]
default = ["wgpu"]
wgpu = ["libcosmic/wgpu"]
